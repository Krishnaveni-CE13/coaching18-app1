name: Deploy Flask App 2 to ECS

on:
  push:
    branches: [ "coaching18-app", "main" ]
    paths:
      - 'flask-SQS/**'
      - '.github/workflows/SQS.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Test
        working-directory: ./flask-SQS
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements.txt ]; then pytest; fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/flask-app2-repo:$IMAGE_TAG ./flask-app2
          docker push $ECR_REGISTRY/flask-app2-repo:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/flask-app2-repo:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download ECS Task Definition
        run: |
          aws ecs describe-task-definition --task-definition flask-app2-task-def --query taskDefinition > task-definition.json

      - name: Update Task Definition Image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: flask-app2-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: flask-app2-ecs-service
          cluster: ecs-cluster-name
          wait-for-service-stability: true