name: SQS Service CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'service-sqs/**' # Optional: triggers only if changes occur in this service folder
  pull_request:
    branches:
      - main
    paths:
      - 'service-sqs/**'
  workflow_dispatch:

jobs:
  ci-sqs-service:
    name: CI - SQS App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 boto3

      - name: Lint Code
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        run: |
          pytest

      - name: Build Docker Image
        run: |
          docker build -t sqs-flask-app:${{ github.sha }} .

  cd-sqs-service:
    name: CD - SQS App Deployment
    needs: ci-sqs-service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sqs-flask-app-repo # Replace with your SQS service ECR repo name
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download ECS Task Definition
        run: |
          aws ecs describe-task-definition --task-definition sqs-service-task-def --query taskDefinition > task-definition.json

      - name: Update Task Definition Image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: sqs-app-container # Must match container name in task definition
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: sqs-flask-ecs-service # Replace with your SQS service ECS service name
          cluster: ecs-cluster-name
          wait-for-service-stability: true